# Genimage configuration for viz1090 SD card image
# Creates a bootable SD card for Raspberry Pi CM4

image boot.vfat {
    vfat {
        files = {
            "bcm2711-rpi-cm4.dtb",
            "cmdline.txt",
            "config.txt",
            "fixup4.dat",
            "start4.elf",
            "Image",
            "overlays"
        }
    }
    size = 64M
}

image sdcard.img {
    hdimage {
    }

    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}
